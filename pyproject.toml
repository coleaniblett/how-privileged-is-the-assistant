[project]
name = "vestigial-user"
version = "0.1.0"
description = "Is the assistant a privileged persona? Vestigial regression, logit distortion and overgeneralization across post-training stages."
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.5",
    "transformers>=4.57",
    "accelerate>=1.0",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "tabulate>=0.9",
    "pytest>=8.0",
]

[project.optional-dependencies]
# 8-bit loading for the 31B/32B models on 48 GB cards (exploration/shiller_user_turns): uv sync --extra quant
quant = ["bitsandbytes>=0.45"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
